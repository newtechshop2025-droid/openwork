<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWork</title>

    <link rel="icon" type="image/svg+xml" href="/openwork-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("openwork.themePref") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }

        function handleChunkError(msg) {
          try {
            var lastReload = sessionStorage.getItem("openwork.lastChunkReload");
            var now = Date.now();
            if (lastReload && now - parseInt(lastReload, 10) < 5000) {
              console.error("Chunk load failed repeatedly, stopping auto-reload to avoid loop.", msg);
              return;
            }
            sessionStorage.setItem("openwork.lastChunkReload", now.toString());
          } catch (err) {}
          console.warn("Chunk load failed, reloading...", msg);
          window.location.reload();
        }

        window.addEventListener("error", function (e) {
          var msg = (e && e.message) || "";
          if (
            msg.indexOf("Failed to fetch dynamically imported module") > -1 ||
            msg.indexOf("Importing a module script failed") > -1
          ) {
            handleChunkError(msg);
          }
        }, true);

        window.addEventListener("unhandledrejection", function (e) {
          var reason = e && e.reason;
          var msg = (reason && (reason.message || reason)) || "";
          if (
            typeof msg === "string" &&
            (msg.indexOf("Failed to fetch dynamically imported module") > -1 ||
              msg.indexOf("Importing a module script failed") > -1)
          ) {
            handleChunkError(msg);
          }
        });
      })();
    </script>
  </head>
  <body class="bg-dls-surface text-dls-text mac:bg-transparent">
    <div id="root"></div>
    <script type="module" src="/src/index.react.tsx"></script>
  </body>
</html>
